<title>mind-viz — checkout-slow</title>
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}

#hud{position:fixed;top:16px;left:16px;color:#cdd6f4;font-size:13px;line-height:1.7;
  background:rgba(10,14,28,.72);border:1px solid #1e2748;border-radius:10px;padding:12px 16px;
  backdrop-filter:blur(6px);max-width:340px;pointer-events:none}
#hud b{color:#fff;font-size:14px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;margin-left:6px}
.open{background:#33261a;color:#f5a623}.done{background:#14332a;color:#5be49b}
.legend{position:fixed;bottom:16px;left:16px;color:#8892b0;font-size:12px;line-height:1.9;
  background:rgba(10,14,28,.6);border:1px solid #1e2748;border-radius:10px;padding:10px 14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
#tip{position:fixed;pointer-events:none;color:#e6ebff;font-size:12px;line-height:1.6;
  background:rgba(13,18,36,.94);border:1px solid #2a3560;border-radius:8px;padding:10px 12px;
  max-width:380px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#tip .k{color:#8892b0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div class="legend">
  <span class="dot" style="background:#fff"></span>goal&nbsp;&nbsp;
  <span class="dot" style="background:#b48cff"></span>agent&nbsp;&nbsp;
  <span class="dot" style="background:#4dd7ff"></span>finding<br>
  <span class="dot" style="background:#f5a623"></span>question&nbsp;&nbsp;
  <span class="dot" style="background:#5be49b"></span>answer<br>
  <span style="opacity:.7">drag to pan &middot; wheel to zoom &middot; hover a star</span>
</div>
<div id="tip"></div>
<script>
const G = {"title": "checkout-slow — Why is the demo checkout endpoint slow? p99 is ~2.4s but median ~80ms. Find the cause.", "stats": {"agents": 3, "findings": 21, "questions": 3, "open": 0, "converged": true}, "nodes": [{"id": "hub", "kind": "goal", "label": "Why is the demo checkout endpoint slow? p99 is ~2.4s but median ~80ms. Find the cause.", "x": 0.0, "y": 0.0, "r": 26, "detail": "swarm: checkout-slow"}, {"id": "agent0", "kind": "agent", "label": "cache", "x": 1.2858791391047208e-14, "y": -210.0, "r": 13, "detail": "agents/cache.md"}, {"id": "agent1", "kind": "agent", "label": "database", "x": 181.86533479473212, "y": 104.99999999999997, "r": 13, "detail": "agents/database.md"}, {"id": "agent2", "kind": "agent", "label": "network", "x": -181.8653347947321, "y": 105.00000000000007, "r": 13, "detail": "agents/network.md"}, {"id": "f0", "kind": "finding", "label": "bench.py 60 twice (single sequential client): median=14ms both runs, p99=424ms then 400ms,", "x": 400.0, "y": 0.0, "r": 7, "detail": "findings.md"}, {"id": "f1", "kind": "finding", "label": "access.log across both runs: 120 reqs, exactly 4 slow (>100ms): 436, 399, 399, 466 ms — ev", "x": 386.3703305156273, "y": 103.5276180410083, "r": 7, "detail": "findings.md"}, {"id": "f2", "kind": "finding", "label": "cache mechanism: refresh() holds one lock ~0.5s (REBUILD_COST) rebuilding all 50k rows; ea", "x": 346.4101615137755, "y": 199.99999999999997, "r": 7, "detail": "findings.md"}, {"id": "f3", "kind": "finding", "label": "RULED OUT: no request >100ms occurs outside a rebuild window — tail is 100% attributable t", "x": 282.842712474619, "y": 282.842712474619, "r": 7, "detail": "findings.md"}, {"id": "f4", "kind": "finding", "label": "cache ALONE cannot produce a 2.4s p99 under this bench: a single request waits at most one", "x": 200.00000000000006, "y": 346.41016151377545, "r": 7, "detail": "findings.md"}, {"id": "f5", "kind": "finding", "label": "bench.py 60 solo client (this VM): median=14ms p99=450ms max=470ms — reproduces the tail s", "x": 103.5276180410083, "y": 386.3703305156273, "r": 7, "detail": "findings.md"}, {"id": "f6", "kind": "finding", "label": "raw TCP connect only, 295 samples over 12s spanning 3 rebuilds: median=0.2ms p99=0.5ms max", "x": 2.4492935982947064e-14, "y": 400.0, "r": 7, "detail": "findings.md"}, {"id": "f7", "kind": "finding", "label": "GET / (handler touches NO cache lock), 200 samples over ~8s spanning 2 rebuilds: median=0.", "x": -103.52761804100825, "y": 386.3703305156273, "r": 7, "detail": "findings.md"}, {"id": "f8", "kind": "finding", "label": "/checkout split timings (60 reqs): connect phase p99=0.3ms vs response phase p99=445.8ms —", "x": -199.99999999999991, "y": 346.4101615137755, "r": 7, "detail": "findings.md"}, {"id": "f9", "kind": "finding", "label": "server access.log vs client-side over 121 reqs: median 14.0 vs 14.4ms, p99 449 vs 446ms, m", "x": -282.84271247461896, "y": 282.842712474619, "r": 7, "detail": "findings.md"}, {"id": "f10", "kind": "finding", "label": "wire facts: HTTP/1.0, Server: BaseHTTP/0.6, Content-Length 16, connection closed per reque", "x": -346.4101615137755, "y": 199.99999999999997, "r": 7, "detail": "findings.md"}, {"id": "f11", "kind": "finding", "label": "concurrency probe C=4: p99=505ms (vs solo ~450ms) — tail grows slowly with queue depth", "x": -386.3703305156273, "y": 103.52761804100841, "r": 7, "detail": "findings.md"}, {"id": "f12", "kind": "finding", "label": "concurrency probe C=16: connect p99=2017ms max=2020ms, response p99=580ms, total p99=2090m", "x": -400.0, "y": 4.898587196589413e-14, "r": 7, "detail": "findings.md"}, {"id": "f13", "kind": "finding", "label": "VERDICT: transport is an amplifier, not the cause — solo connect is sub-ms and solo tail i", "x": -386.3703305156273, "y": -103.52761804100832, "r": 7, "detail": "findings.md"}, {"id": "f14", "kind": "finding", "label": "Baseline, unmodified server, `bench.py 60`: median=15ms p99=449ms max=1560ms", "x": -346.4101615137755, "y": -199.9999999999999, "r": 7, "detail": "findings.md"}, {"id": "f15", "kind": "finding", "label": "Per-request data access = exactly 3 `CACHE.get()` dict lookups on a 50k-entry in-memory ta", "x": -282.84271247461913, "y": -282.84271247461885, "r": 7, "detail": "findings.md"}, {"id": "f16", "kind": "finding", "label": "Variant server with data-fetch cost removed (READ_COST=0, rebuild unchanged): median=1ms →", "x": -200.00000000000017, "y": -346.4101615137754, "r": 7, "detail": "findings.md"}, {"id": "f17", "kind": "finding", "label": "Variant server with rebuild lock-hold shrunk (REBUILD_COST=0.005, READ_COST=4ms unchanged)", "x": -103.52761804100825, "y": -386.3703305156273, "r": 7, "detail": "findings.md"}, {"id": "f18", "kind": "finding", "label": "Server-side access.log from baseline run: only 2 of 60 requests >100ms (448ms, 395ms), spa", "x": -7.347880794884119e-14, "y": -400.0, "r": 7, "detail": "findings.md"}, {"id": "f19", "kind": "finding", "label": "Bench client max (1560ms) exceeded the server-logged max handler time (448ms): the extra ~", "x": 103.52761804100811, "y": -386.37033051562736, "r": 7, "detail": "findings.md"}, {"id": "f20", "kind": "finding", "label": "RULED OUT (database area): table size, query cost, missing index, I/O, connection pooling,", "x": 200.00000000000006, "y": -346.41016151377545, "r": 7, "detail": "findings.md"}, {"id": "q0", "kind": "question", "label": "cache asks: the shared bench (sequential) gives p99 ~420ms, fully explained by the 0.5s rebu", "x": 282.84271247461896, "y": -282.8427124746191, "r": 9, "detail": "questions.md:5"}, {"id": "a0_0", "kind": "answer", "label": "network answers: measured. C=1 p99≈450ms (all response phase), C=4 p99≈505ms, C=", "x": 346.84271247461896, "y": -282.8427124746191, "r": 5, "detail": "questions.md"}, {"id": "a0_1", "kind": "answer", "label": "database adds: even with the SEQUENTIAL bench client I measured client max=1560m", "x": 218.84271247461896, "y": -282.8427124746191, "r": 5, "detail": "questions.md"}, {"id": "q1", "kind": "question", "label": "database asks: reads share ONE lock with the 4s rebuild (server.py:41 vs :50). Can the cache re", "x": 346.41016151377534, "y": -200.00000000000017, "r": 9, "detail": "questions.md:8"}, {"id": "a1_0", "kind": "answer", "label": "cache answers: yes, correct — this lock structure is already copy-on-write compa", "x": 410.41016151377534, "y": -200.00000000000017, "r": 5, "detail": "questions.md"}, {"id": "q2", "kind": "question", "label": "database asks: client max (1560ms) > server-logged handler max (448ms) — is the accept-queue ba", "x": 386.37033051562724, "y": -103.52761804100862, "r": 9, "detail": "questions.md:10"}, {"id": "a2_0", "kind": "answer", "label": "network answers (already measured above): yes — queuing is the amplifier; C=16 s", "x": 450.37033051562724, "y": -103.52761804100862, "r": 5, "detail": "questions.md"}], "edges": [{"a": "hub", "b": "agent0", "kind": "member"}, {"a": "hub", "b": "agent1", "kind": "member"}, {"a": "hub", "b": "agent2", "kind": "member"}, {"a": "hub", "b": "f0", "kind": "finding"}, {"a": "hub", "b": "f1", "kind": "finding"}, {"a": "hub", "b": "f2", "kind": "finding"}, {"a": "hub", "b": "f3", "kind": "finding"}, {"a": "hub", "b": "f4", "kind": "finding"}, {"a": "hub", "b": "f5", "kind": "finding"}, {"a": "hub", "b": "f6", "kind": "finding"}, {"a": "hub", "b": "f7", "kind": "finding"}, {"a": "hub", "b": "f8", "kind": "finding"}, {"a": "hub", "b": "f9", "kind": "finding"}, {"a": "hub", "b": "f10", "kind": "finding"}, {"a": "hub", "b": "f11", "kind": "finding"}, {"a": "hub", "b": "f12", "kind": "finding"}, {"a": "hub", "b": "f13", "kind": "finding"}, {"a": "hub", "b": "f14", "kind": "finding"}, {"a": "hub", "b": "f15", "kind": "finding"}, {"a": "hub", "b": "f16", "kind": "finding"}, {"a": "hub", "b": "f17", "kind": "finding"}, {"a": "hub", "b": "f18", "kind": "finding"}, {"a": "hub", "b": "f19", "kind": "finding"}, {"a": "hub", "b": "f20", "kind": "finding"}, {"a": "agent0", "b": "q0", "kind": "asks"}, {"a": "q0", "b": "a0_0", "kind": "answer"}, {"a": "q0", "b": "a0_1", "kind": "answer"}, {"a": "agent1", "b": "q1", "kind": "asks"}, {"a": "q1", "b": "a1_0", "kind": "answer"}, {"a": "agent1", "b": "q2", "kind": "asks"}, {"a": "q2", "b": "a2_0", "kind": "answer"}]};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip'), hud = document.getElementById('hud');
const KIND = {goal:'#ffffff',agent:'#b48cff',finding:'#4dd7ff',question:'#f5a623',answer:'#5be49b'};
const OPEN = '0' === '1';
hud.innerHTML = '<b>' + G.title + '</b><span class="badge ' + (G.stats.converged?'done':'open') + '">'
  + (G.stats.converged ? 'converged' : G.stats.open + ' open') + '</span><br>'
  + G.stats.agents + ' agents &middot; ' + G.stats.findings + ' findings &middot; '
  + G.stats.questions + ' questions &middot; ' + G.nodes.length + ' stars';
const stars = Array.from({length:260},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28}));
let ox=0,oy=0,z=1,drag=null,hover=null,t=0;
const DPR = Math.min(devicePixelRatio||1,2);
function fit(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',fit);fit();
function map(n){const cx=cv.width/2/DPR,cy=cv.height/2/DPR;return[cx+(n.x+ox)*z,cy+(n.y+oy)*z]}
function pick(mx,my){let best=null,bd=1e9;for(const n of G.nodes){const[x,y]=map(n);const d=Math.hypot(mx-x,my-y);if(d<Math.max(n.r*z+6,10)&&d<bd){best=n;bd=d}}return best}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(drag){ox=drag.ox+(e.clientX-drag.x)/z;oy=drag.oy+(e.clientY-drag.y)/z;return}
  const n=pick(e.clientX,e.clientY);hover=n;
  if(n){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML='<div class="k">'+n.kind+'</div>'+esc(n.label)+(n.detail?'<br><span style="color:#8892b0">'+esc(n.detail)+'</span>':'')}
  else tip.style.display='none';
});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();z*=e.deltaY<0?1.13:0.885;z=Math.min(4,Math.max(.25,z))},{passive:false});
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function draw(){
  t+=0.016;ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,innerWidth,innerHeight);
  for(const s of stars){ctx.globalAlpha=.25+.25*Math.sin(t+s.p);ctx.fillStyle='#8ea2d8';
    ctx.fillRect(s.x*innerWidth,s.y*innerHeight,s.r,s.r)}
  ctx.globalAlpha=1;
  for(const e of G.edges){const a=G.nodes.find(n=>n.id===e.a),b=G.nodes.find(n=>n.id===e.b);
    if(!a||!b)continue;const[x1,y1]=map(a),[x2,y2]=map(b);
    const glow=(Math.sin(t*2+x1*.01)+1)/2;
    ctx.strokeStyle=e.kind==='answer'?'rgba(91,228,155,.5)':e.kind==='asks'?'rgba(245,166,35,.45)':'rgba(120,140,220,.28)';
    ctx.lineWidth=e.kind==='member'?1.6:1;
    ctx.setLineDash(e.kind==='finding'?[2,6]:[]);ctx.lineDashOffset=-t*8;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
  for(const n of G.nodes){const[x,y]=map(n);const r=n.r*z;const col=KIND[n.kind];
    const pulse=n.kind==='question'&&!n.detail.includes('OPEN')?1:.12*Math.sin(t*3+n.x)+1;
    const g=ctx.createRadialGradient(x,y,0,x,y,r*3.4);
    g.addColorStop(0,col+'cc');g.addColorStop(.35,col+'33');g.addColorStop(1,col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.4*pulse,0,6.29);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,6.29);ctx.fill();
    if(n.kind==='question'&&n.detail.includes('OPEN')){ctx.strokeStyle='#f5a623';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,r+4+2*Math.sin(t*3),0,6.29);ctx.stroke()}
    if(n===hover||n.kind==='agent'||n.kind==='goal'){ctx.fillStyle='#e6ebff';
      ctx.font=(n.kind==='goal'?'600 14px':'12px')+' ui-monospace,monospace';ctx.textAlign='center';
      const short=n.label.length>34?n.label.slice(0,34)+'…':n.label;
      ctx.fillText(short,x,y-r-8)}}
  requestAnimationFrame(draw)}
draw();
</script></body></html>
